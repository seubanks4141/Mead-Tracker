<div class="empty-state">
  <div class="empty-state__icon" aria-hidden="true">{{ icon|default:"◇" }}</div>
  <h2>{{ title|default:"Nothing here yet" }}</h2>
  {% if text %}<p>{{ text }}</p>{% endif %}
  {% if action_url and action_label %}
    <a class="button button--primary" href="{{ action_url }}">{{ action_label }}</a>
  {% endif %}
</div>
